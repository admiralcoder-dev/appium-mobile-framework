name: Appium Framework Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework-checks:
    name: Java 21 / Appium configuration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and run non-device tests
        run: mvn -B --no-transfer-progress verify
      - name: Upload Surefire results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-framework-test-results
          path: |
            target/surefire-reports/
            target/mobile-screenshots/
          if-no-files-found: warn
          retention-days: 14
